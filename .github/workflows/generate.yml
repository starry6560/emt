name: generate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "생성 대상"
        type: choice
        options: [campaign, three-day, three-day-rescore, three-day-repair]
        default: campaign
      source_run:
        description: "재측정할 후보가 있는 실행 ID"
        required: false
        default: ""
      profiles:
        description: "3일 도전 조합 목록 (JSON 배열)"
        required: false
        default: "[1,2,3,4,5]"
      rounds:
        description: "생성할 라운드 (예: 1-300, 또는 7 10 25)"
        required: true
        default: "1-300"
      machines:
        description: "동시에 쓸 서버 수 (최대 20)"
        required: true
        default: "20"
      attempt:
        description: "재생성 회차 (회차마다 다른 시작값)"
        required: true
        default: "0"
      seconds:
        description: "라운드당 최대 초"
        required: true
        default: "3600"

permissions:
  contents: read
  actions: read

jobs:
  split:
    if: ${{ inputs.mode == 'campaign' || inputs.mode == '' }}
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - id: split
        env:
          ROUNDS: ${{ inputs.rounds }}
          MACHINES: ${{ inputs.machines }}
        run: echo "chunks=$(dart run tools/split_rounds.dart "$ROUNDS" "$MACHINES")" >> "$GITHUB_OUTPUT"

  generate:
    needs: split
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        rounds: ${{ fromJson(needs.split.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      # A compiled executable runs the searches faster than the JIT.
      - run: dart compile exe tools/generate_campaign.dart -o generate
      # Stop generating before the job limit so finished rounds still upload.
      - timeout-minutes: 320
        env:
          ROUNDS: ${{ matrix.rounds }}
          GEN_WORKERS: "4"
          GEN_ATTEMPT: ${{ inputs.attempt }}
          GEN_SECONDS: ${{ inputs.seconds }}
        run: ./generate $ROUNDS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rounds-${{ strategy.job-index }}
          path: tools/generated/campaign/*.json
          retention-days: 1

  three-day:
    if: ${{ inputs.mode == 'three-day' || inputs.mode == 'three-day-rescore' || inputs.mode == 'three-day-repair' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        profile: ${{ fromJson(inputs.profiles || '[1,2,3,4,5]') }}
        seed: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart compile exe tools/generate_three_day.dart -o generate-three-day
      - uses: actions/download-artifact@v4
        if: ${{ inputs.mode == 'three-day-rescore' || inputs.mode == 'three-day-repair' }}
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          pattern: three-day-*
          path: tools/input/three_day
      - name: Generate one candidate
        timeout-minutes: 63
        env:
          DAILY_PROFILE: ${{ matrix.profile }}
          GEN_ATTEMPT: ${{ matrix.seed }}
          GEN_SECONDS: ${{ inputs.seconds }}
          DAILY_MODE: ${{ inputs.mode == 'three-day-rescore' && 'rescore' || inputs.mode == 'three-day-repair' && 'repair' || 'generate' }}
          DAILY_SOURCE_ROOT: tools/input/three_day
        run: ./generate-three-day
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-day-${{ matrix.profile }}-seed-${{ matrix.seed }}
          path: tools/generated/three_day/*.json
          if-no-files-found: warn
          retention-days: 1
